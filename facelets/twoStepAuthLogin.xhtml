<html
		xmlns:ui="http://java.sun.com/jsf/facelets"
		xmlns:h="http://java.sun.com/jsf/html"
		xmlns:t="http://myfaces.apache.org/tomahawk"
		xmlns:f="http://java.sun.com/jsf/core"
>
	<ui:component>
		<div class="#{loginBean.styleClass} loggedOut loginForm">
			<form class="loginForm" action="#{loginBean.action}" method="post" onsubmit="showLoadingMessage('#{localizedStrings['com.idega.block.login']['logging_in']}');">
				<div class="sms">
					<label for="twoStepAuthCode">
						<h:outputText value="#{localizedStrings['com.idega.block.login']['login.2_step_auth.header']}" />
					</label>
					<input type="text" id="twoStepAuthCode" name="twoStepAuthCode" size="6" maxlength="6"/>
				</div>

				<t:div styleClass="submit #{loginBean.localeStyle} explanation-text">
					<span><t:outputText value="#{localizedStrings['com.idega.block.login']['login.2_step_auth.explanation.hidden_email']}" /> </span>
					<ui:repeat value="#{loginBean.hiddenParameters}" var="parameter">
						<t:outputText value="#{parameter.value}"  rendered="#{parameter.parameter == 'email'}" />
					</ui:repeat>
				</t:div>

				<t:div styleClass="submit #{loginBean.localeStyle} explanation-text">
					<span><t:outputText value="#{localizedStrings['com.idega.block.login']['login.2_step_auth.explanation.code_validity_time']}" /> </span>
					<ui:repeat value="#{loginBean.hiddenParameters}" var="parameter">
						<t:outputText value="#{parameter.value}"  rendered="#{parameter.parameter == 'twoStepAuthCodeValidity'}" />
					</ui:repeat>
				</t:div>
				
				<t:div styleClass="submit #{loginBean.localeStyle}" rendered="#{!loginBean.useSubmitLinks}">
					<input type="button" onclick="window.history.back();" value="#{localizedStrings['com.idega.block.login']['cancel_text']}" class="#{loginBean.buttonStyleClass}"/>
					<input type="submit" value="#{localizedStrings['com.idega.block.login']['login_text']}" class="#{loginBean.buttonStyleClass}"/>
				</t:div>
				<t:div styleClass="submit #{loginBean.localeStyle}" rendered="#{loginBean.useSubmitLinks}">
					<a href="#" class="loginButton">
						<span><t:outputText value="#{localizedStrings['com.idega.block.login']['login_text']}" /></span>
					</a>
					<a href="javascript:window.history.back();" class="backButton">
						<span><t:outputText value="#{localizedStrings['com.idega.block.login']['cancel_text']}" /></span>
					</a>
				</t:div>
				
				<ui:repeat value="#{loginBean.hiddenParameters}" var="parameter">
					<input type="hidden" name="#{parameter.parameter}" value="#{parameter.value}" />
				</ui:repeat>
				
				<input type="hidden" name="isCancel" id="isCancel" value="false" />
			</form>
		</div>
	</ui:component>
</html>
